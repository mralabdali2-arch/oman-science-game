<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مناهج سلطنة عمان</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f121e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            /* تأثير الخلفية المخططة الخفيفة */
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .card {
            background-color: #171c2c;
            border: 1px solid #232a42;
            border-radius: 16px;
            padding: 35px 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .badge {
            background-color: #133830;
            color: #2ecc71;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
        }

        p {
            font-size: 15px;
            line-height: 1.8;
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .arrow {
            font-size: 20px;
            color: #f1c40f;
            margin-bottom: 15px;
        }

        .download-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 0;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">🇴🇲 مناهج سلطنة عمان</div>
        <p>أهلاً بكم. في الأسفل مرفق أسئلة لمادة العلوم والاسلامية، ونحن نعمل على إكمال المواد الأخرى. هذه الكتب مخصصة للمنهج العماني.</p>
        <div class="arrow">↓</div>
        <!-- تم ربط الزر بملف 2 mwad.exe بالشكل الصحيح -->
        <a href="/oman-science-game/2 mwad.exe" download>...</a>
    </div>

</body>
</html>
